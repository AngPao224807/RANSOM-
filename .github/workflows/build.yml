name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Pull Kivy Buildozer Docker
        run: docker pull kivy/buildozer

      - name: สร้าง APK ด้วย Docker
        run: |
          docker run \
            --volume "$(pwd)":/home/user/hostcwd \
            kivy/buildozer \
            android debug

      - name: อัปโหลด APK
        uses: actions/upload-artifact@v4
        with:
          name: ransom-apk
          path: bin/*.apk
